<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Circuit definition trace -->
  <path
    d="M6 30L18 6L30 30"
    stroke="#243B60"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.35"
  />
  <!-- Active circuit path -->
  <path
    d="M6 30L18 6L30 30"
    stroke="url(#circuitGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Crossbar with circuit line -->
  <line
    x1="11"
    y1="22"
    x2="25"
    y2="22"
    stroke="#21C7B7"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <!-- Central circuit micro-node -->
  <circle cx="18" cy="22" r="2.2" fill="#FFFFFF" />
  <!-- Apex node -->
  <circle cx="18" cy="6" r="2.6" fill="#21C7B7" />
  <!-- Base termination nodes -->
  <circle cx="6" cy="30" r="2.2" fill="#3B82F6" />
  <circle cx="30" cy="30" r="2.2" fill="#3B82F6" />

  <defs>
    <linearGradient id="circuitGrad" x1="6" y1="6" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
      <stop offset="1" stop-color="#21C7B7" />
    </linearGradient>
  </defs>
</svg>
