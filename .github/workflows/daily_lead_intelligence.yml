name: Ariyx Lead Intelligence Daily Cloud Runner

on:
  # Automatic cron schedule is commented out until preflight passes and user explicitly approves:
  # schedule:
  #   # 8:00 AM Nigerian Time (WAT, UTC+1) = 07:00 UTC daily
  #   - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'preflight'
        type: choice
        options:
          - 'preflight'          # 100% read-only connectivity and credentials verification
          - 'read-only-preview'  # Researches 1-5 prospects without writing to Google Sheets
          - 'live-sync'          # Researches and syncs accepted prospects to Google Sheets
      target:
        description: 'Daily target of accepted prospects (for live-sync)'
        required: false
        default: '30'
      max_candidates:
        description: 'Maximum candidate sites to research (for live-sync)'
        required: false
        default: '120'

concurrency:
  group: ariyx-lead-intelligence
  cancel-in-progress: false

jobs:
  lead-intelligence:
    name: Execute Lead Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'lead-intelligence/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lead-intelligence/requirements.txt

      - name: Execute Lead Pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PYTHONPATH: lead-intelligence
        run: |
          MODE="${{ github.event.inputs.mode || 'scheduled' }}"
          echo "=========================================================="
          echo " Starting Ariyx Lead Intelligence in mode: $MODE"
          echo "=========================================================="

          # Safety check for scheduled runs: only proceed if explicitly approved by user
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ vars.ENABLE_CLOUD_SCHEDULE }}" != "true" ]; then
              echo "[NOTICE] Automatic scheduled cloud runs are paused."
              echo "To activate daily 8:00 AM runs, set repository variable ENABLE_CLOUD_SCHEDULE=true"
              echo "Run completed cleanly without modifications."
              exit 0
            fi
            echo "[SCHEDULED RUN] Executing daily target (30 leads)..."
            python lead-intelligence/run_daily.py --target 30 --max-candidates 120 --sync-sheets
            exit $?
          fi

          # Manual workflow_dispatch modes:
          case "$MODE" in
            preflight)
              echo "[PREFLIGHT] Running 100% read-only credentials and connectivity verification..."
              python lead-intelligence/run_daily.py --cloud-preflight
              ;;
            read-only-preview)
              echo "[PREVIEW] Running read-only prospect discovery (zero sheet writes)..."
              python lead-intelligence/run_daily.py --target 1 --max-candidates 5 --smtp-fail-fast 5
              ;;
            live-sync)
              echo "[LIVE SYNC] Running live acceptance lead pipeline with Google Sheets sync..."
              python lead-intelligence/run_daily.py \
                --target ${{ github.event.inputs.target || '30' }} \
                --max-candidates ${{ github.event.inputs.max_candidates || '120' }} \
                --sync-sheets
              ;;
            *)
              echo "[ERROR] Unknown mode: $MODE"
              exit 1
              ;;
          esac
